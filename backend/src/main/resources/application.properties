spring.application.name=finance-tracker

# Po??czenie z baz? PostgreSQL w Dockerze
spring.datasource.url=jdbc:postgresql://localhost:5432/financedb
spring.datasource.username=admin
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - WALIDACJA (Hibernate NIE tworzy tabel, robi to Liquibase)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true