services:
  db:
    image: postgres:16-alpine
    container_name: financetracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uwaga: brak sekcji "ports" celowo - baza NIE jest wystawiona na zewnątrz,
    # dostępna tylko wewnątrz sieci Dockera (dla backendu).

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financetracker_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_LIQUIBASE_CONTEXTS: "!dev"
    networks:
      - internal
    expose:
      - "8080"
    # backend też NIE jest wystawiony na zewnątrz - wchodzimy do niego
    # wyłącznie przez reverse proxy Nginxa (/api/...).

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financetracker_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "0.0.0.0:3000:80"
    networks:
      - internal
    labels:
      - "glance.hide=false"
      - "glance.id=financetracker"
      - "glance.name=FinanceTracker"
      - "glance.icon=si:cashapp"
      - "glance.url=http://192.168.68.57"
      - "glance.description=Śledzenie finansów (w budowie — pusta baza)"

networks:
  internal:
    driver: bridge

volumes:
  db_data: