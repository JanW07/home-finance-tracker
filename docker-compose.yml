version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_tracker_db
    environment:
      POSTGRES_DB: financedb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: