services:
  db:
    image: postgres:16-alpine
    container_name: financetracker_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"   # <- to jest różnica względem prod: port wystawiony na hosta,
      #    żeby IDE / mvn spring-boot:run mogło się połączyć z localhost
    volumes:
      - db_data_dev:/var/lib/postgresql/data

volumes:
  db_data_dev:
